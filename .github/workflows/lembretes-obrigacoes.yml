# Lembrete diário de vencimento de obrigações (Portal do Cliente).
# Chama a rota protegida do site uma vez por dia; a rota decide quem avisar
# (obrigações pendentes que vencem hoje ou em 3 dias) e não repete aviso se
# rodar duas vezes no mesmo dia. Ver src/app/api/cron/lembretes-obrigacoes.
#
# Precisa do segredo CRON_SECRET em Settings > Secrets and variables > Actions,
# com o MESMO valor configurado na Hostinger.
name: Lembretes de obrigações

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília (o GitHub pode atrasar alguns minutos).
    - cron: "0 11 * * *"
  # Fase 10H: `simular_falha` valida o alerta sem chamar a produção.
  workflow_dispatch:
    inputs:
      simular_falha:
        description: "Simular falha (não chama a produção; só testa o alerta)"
        type: boolean
        default: false

# Padrão: só leitura. issues: write fica só no job de alerta (Fase 10F), que
# não recebe nenhum segredo.
permissions:
  contents: read

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar lembretes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SIMULAR: ${{ inputs.simular_falha && 'sim' || 'nao' }}
        run: |
          if [ "$SIMULAR" = "sim" ]; then
            echo "::warning::Falha SIMULADA (nenhuma chamada à produção)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Segredo CRON_SECRET não configurado no GitHub."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://wjbassessoriacontabil.com.br/api/cron/lembretes-obrigacoes

  # Fase 10F: falha vira issue no GitHub (e e-mail para quem acompanha o
  # repositório); sucesso fecha o alerta. Antes, a rotina falhou 44 dias
  # seguidos sem aviso nenhum.
  alerta:
    needs: lembretes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir, comentar ou fechar o alerta
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/alerta-rotina.sh "${{ inputs.simular_falha && 'Lembretes de obrigações (simulação)' || 'Lembretes de obrigações' }}" "${{ needs.lembretes.result == 'success' && 'success' || 'failure' }}"
