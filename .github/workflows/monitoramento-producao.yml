# Fase 10F: monitoramento diário da produção, SOMENTE LEITURA, sem segredos.
# Reaproveita scripts/wjb-ai/producao/monitorar.sh (páginas públicas, áreas
# protegidas, redirecionamentos, cabeçalhos de segurança, API de contato
# recusando dado inválido sem gravar nada, prévias públicas).
# Falha abre um issue "Falha na rotina: Monitoramento da produção" (e-mail
# para quem acompanha o repositório); sucesso fecha o alerta.
#
# Atenção: rotinas agendadas só rodam a partir da branch padrão (main). Até o
# merge, isto só roda manualmente. O CDN da Hostinger (hcdn) já bloqueou
# navegadores automatizados; se ele bloquear o runner do GitHub, o alerta vai
# disparar por isso. Nesse caso, a primeira linha do log mostra códigos 403.
name: Monitoramento da produção

on:
  schedule:
    # 12:00 e 21:00 UTC = 09:00 e 18:00 em Brasília.
    - cron: "0 12,21 * * *"
  workflow_dispatch:
    inputs:
      simular_falha:
        description: "Simular falha (só testa o alerta)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Falha simulada (só com simular_falha)
        if: ${{ inputs.simular_falha }}
        run: |
          echo "::warning::Falha SIMULADA."
          exit 1
      - name: Monitoramento somente leitura
        run: bash scripts/wjb-ai/producao/monitorar.sh

  # Fase 10H: rotina agendada que deixa de rodar (sem erro registrado).
  execucao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rotinas agendadas executaram no prazo
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verificar-execucao-rotinas.sh

  alerta:
    needs: monitorar
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir, comentar ou fechar o alerta
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/alerta-rotina.sh "${{ inputs.simular_falha && 'Monitoramento da produção (simulação)' || 'Monitoramento da produção' }}" "${{ needs.monitorar.result == 'success' && 'success' || 'failure' }}"

  alerta-execucao:
    needs: execucao
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Abrir, comentar ou fechar o alerta de rotina sem execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/alerta-rotina.sh "Rotina agendada sem execução" "${{ needs.execucao.result == 'success' && 'success' || 'failure' }}"
